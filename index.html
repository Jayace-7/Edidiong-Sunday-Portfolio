<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edidiong Sunday | Brand & Social Media Designer</title>
  <meta name="description" content="Edidiong Sunday — Brand & Social Media Designer. Design that connects and converts." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ==========================================================================
       NAVBAR
       ========================================================================== -->
  <header class="navbar" id="navbar">
    <div class="navbar__inner">

      <!-- Logo -->
      <a href="#home" class="navbar__logo">
        <span class="navbar__mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3H19V7H9V10.5H17V14.5H9V17H19V21H5V3Z" fill="#022443"/>
          </svg>
        </span>
        <span class="navbar__brand">
          <span class="navbar__name">EDIDIONG SUNDAY</span>
          <span class="navbar__title">Brand & Social Media Designer</span>
        </span>
      </a>

      <!-- Nav links -->
      <nav class="navbar__links" id="navbarLinks">
        <a href="#home" class="navbar__link navbar__link--active">Home</a>
        <a href="#about" class="navbar__link">About</a>
        <a href="#services" class="navbar__link">Services</a>
        <a href="#work" class="navbar__link">Work</a>
        <a href="#testimonials" class="navbar__link">Testimonials</a>
        <a href="#contact" class="navbar__link">Contact</a>
      </nav>

      <!-- Actions -->
      <div class="navbar__actions">
        <a href="#contact" class="btn btn--primary">
          <span>Let's Talk</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" />
          </svg>
        </a>

        <button class="navbar__toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        </button>

        <button class="navbar__burger" id="navbarBurger" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Page content sections go here -->
  <main>
    <!-- HOME / HERO section coming next -->
  </main>

  <script src="js/main.js"></script>
</body>
</html>
